name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate version tag
        shell: bash
        run: |
          project_version="$(dotnet msbuild src/SteamWorkshopUnsub.csproj -nologo -getProperty:Version)"

          if [[ "$GITHUB_REF_NAME" != "$project_version" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match project version '$project_version'." >&2
            exit 1
          fi

      - name: Publish application
        run: |
          dotnet publish src/SteamWorkshopUnsub.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --property:PublishProfile=Bundled
          dotnet publish src/SteamWorkshopUnsub.csproj \
            --configuration Release \
            --runtime win-x64 \
            --property:PublishProfile=Bundled

      - name: Package application
        shell: bash
        run: |
          mkdir -p artifacts/release
          zip -j "artifacts/release/SteamWorkshopUnsub-linux-x64-${GITHUB_REF_NAME}.zip" \
            artifacts/publish/SteamWorkshopUnsub/release_linux-x64/SteamWorkshopUnsub \
            artifacts/publish/SteamWorkshopUnsub/release_linux-x64/libsteam_api.so \
            artifacts/publish/SteamWorkshopUnsub/release_linux-x64/THIRD_PARTY_NOTICES.md \
            README.md
          zip -j "artifacts/release/SteamWorkshopUnsub-win-x64-${GITHUB_REF_NAME}.zip" \
            artifacts/publish/SteamWorkshopUnsub/release_win-x64/SteamWorkshopUnsub.exe \
            artifacts/publish/SteamWorkshopUnsub/release_win-x64/steam_api64.dll \
            artifacts/publish/SteamWorkshopUnsub/release_win-x64/THIRD_PARTY_NOTICES.md \
            README.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/release/*.zip \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
